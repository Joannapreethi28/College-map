<h2>Campus Map</h2>
<p class="hint">Click a block to see its rooms and faculty.</p>
<p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>

<div class="layout">
  <!-- SVG = a way to draw shapes in HTML.
       viewBox="0 0 800 500" sets up our drawing area: 800 wide, 500 tall.
       The x/y/w/h numbers stored in the database use this same scale. -->
  <svg class="campus-map" viewBox="0 0 800 500">
    <!-- Background = campus ground -->
    <rect class="ground" x="0" y="0" width="800" height="500" rx="12"></rect>

    <!-- *ngFor repeats this <g> (group) once for every block from the database -->
    <g
      *ngFor="let b of blocks"
      class="block"
      [class.selected]="selectedBlock?.code === b.code"
      (click)="selectBlock(b)"
    >
      <!-- [attr.x] is PROPERTY BINDING to an attribute:
           it sets the rectangle's x to the value of b.svg.x -->
      <rect
        [attr.x]="b.svg.x"
        [attr.y]="b.svg.y"
        [attr.width]="b.svg.w"
        [attr.height]="b.svg.h"
        rx="8"
      ></rect>

      <!-- Label in the middle of the rectangle -->
      <text
        [attr.x]="b.svg.x + b.svg.w / 2"
        [attr.y]="b.svg.y + b.svg.h / 2"
        text-anchor="middle"
        dominant-baseline="middle"
      >
        {{ b.name }}
      </text>
    </g>
  </svg>

  <!-- [block]="selectedBlock" passes the selected block DOWN into the panel (an @Input) -->
  <app-block-panel [block]="selectedBlock" [notFoundCode]="notFoundCode"></app-block-panel>
</div>
