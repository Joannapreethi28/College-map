<nav class="navbar">
  <!-- {{ }} is INTERPOLATION: shows the value of appName from the class -->
  <span class="brand">📍 {{ appName }}</span>

  <!-- Logged in: show the app links, the user's name and Logout.
       ng-container groups elements for *ngIf without adding an extra tag to the page. -->
  <ng-container *ngIf="authService.currentUser">
    <!-- routerLink changes the URL WITHOUT reloading the page (unlike href).
         routerLinkActive adds the "active" CSS class to the link of the current page. -->
    <a routerLink="/map" routerLinkActive="active">Map</a>
    <a routerLink="/search" routerLinkActive="active">Search</a>
    <!-- Only admins see the Admin link -->
    <a routerLink="/admin" routerLinkActive="active" *ngIf="authService.isAdmin()">Admin</a>
    <span class="user">Hi, {{ authService.currentUser.name }}</span>
    <!-- (click) is EVENT BINDING: runs logout() when the button is clicked -->
    <button class="logout" (click)="logout()">Logout</button>
  </ng-container>

  <!-- Logged out: only Login and Sign up -->
  <ng-container *ngIf="!authService.currentUser">
    <a routerLink="/login" routerLinkActive="active">Login</a>
    <a routerLink="/register" routerLinkActive="active">Sign up</a>
  </ng-container>
</nav>
